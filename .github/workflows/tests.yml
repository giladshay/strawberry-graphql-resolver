name: Tests

on:
  push:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-groups
      - run: uv run pytest tests/unit -q --cov=strawberry_graphql_resolver --cov-branch --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unit
          use_oidc: true

  system:
    name: System tests
    # MongoDB 8 cannot start on the kernel used by the ubuntu-26.04
    # (ubuntu-latest) runner (SERVER-121912). Keep the system tests on
    # ubuntu-24.04 until MongoDB ships a version that supports that kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-groups
      - run: uv run pytest tests/system -q
