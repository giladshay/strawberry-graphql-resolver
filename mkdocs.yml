site_name: Strawberry GraphQL Resolver
site_description: Typed query builders and generated Strawberry GraphQL resolvers for Pydantic models.
site_url: https://giladshay.github.io/strawberry-graphql-resolver/
repo_url: https://github.com/giladshay/strawberry-graphql-resolver
repo_name: giladshay/strawberry-graphql-resolver
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_root_heading: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            inherited_members: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.tilde
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User guide:
      - Installation: guide/installation.md
      - Quick start: guide/quickstart.md
      - Query builders: guide/query-builders.md
      - GraphQL resolvers: guide/resolvers.md
      - Database compilers: guide/compilers.md
      - Testing: guide/testing.md
  - API reference:
      - Overview: api/index.md
      - Queries: api/queries.md
      - Resolvers: api/resolvers.md
      - Compilers: api/compilers.md
  - Developers: developers.md

watch:
  - src
