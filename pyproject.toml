[project]
name = "strawberry-graphql-resolver"
version = "0.1.0"
description = "Resolve and map Pydantic models to Strawberry GraphQL types."
readme = "README.md"
authors = [
    { name = "Gil-Ad Shay", email = "giladshay123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.14",
    "strawberry-graphql~=0.335.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "pre-commit~=4.7",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
test = [
    "fastapi>=0.143.3",
    "httpx~=0.28.0",
    "pytest~=8.4",
    "pytest-cov~=7.1",
    "testcontainers[mongodb,mssql]~=4.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "system: tests that require Docker and real database containers",
]

[tool.ty.src]
exclude = ["example"]

[tool.uv.workspace]
members = [
    ".",
]
